title: "コードで学ぶTCP ― 動くおもちゃで読み解く11のしくみ"
summary: |
  TCPを「仕様の暗記」ではなく「読めるコード」として理解する本です。標準ライブラリだけで書いた小さな
  TCP実装を1ファイルずつ読み、ハンドシェイク・シーケンス番号・ウィンドウ・再送・輻輳制御・teardown・RST
  までを、実際に動く Python コードとして追いかけます。各章は「元コード → 判断の流れ → 自分で答える問い →
  動かして確認」の順で進みます。序章と第1章は無料で試し読みできます。
